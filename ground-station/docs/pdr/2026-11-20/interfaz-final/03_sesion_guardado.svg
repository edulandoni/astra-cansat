<text x="808" y="282.53" fill="#112A40" font-size="19" font-weight="700">Principal operativo</text>
<text x="808" y="305.66" fill="#40586D" font-size="18" font-weight="400">La recepción sigue activa y el resultado del escritor queda visible.</text>
<text x="808" y="334.53" fill="#112A40" font-size="19" font-weight="700">Pendientes y descartes</text>
<text x="808" y="357.66" fill="#40586D" font-size="18" font-weight="400">Cada cola conserva su propio conteo y último error.</text>
