<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="03_sesion_guardado-title 03_sesion_guardado-desc">
<title id="03_sesion_guardado-title">03 · Sesión y archivos</title><desc id="03_sesion_guardado-desc">Preparación de fuente y destino, estado por escritor y cierre con evidencia. Diseño final de la interfaz, datos de ejemplo.</desc>
