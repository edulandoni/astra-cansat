<text x="1215" y="46.40" fill="#08756A" font-size="20" font-weight="700">USB DE BANCO · EJEMPLO</text>
<text x="30" y="108.53" fill="#40586D" font-size="19" font-weight="400">SESIÓN Y ARCHIVOS  /  Configuración antes de iniciar y seguimiento durante la sesión</text>
<rect x="30" y="951" width="1540" height="1" fill="#CDD9E2"/>
<text x="30" y="978.66" fill="#40586D" font-size="18" font-weight="400">La pérdida de un destino se presenta por separado. Los resultados de independencia requieren comprobar los soportes físicos.</text>
<rect x="30" y="132" width="740" height="335" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="46" y="162.27" fill="#112A40" font-size="21" font-weight="700">ANTES DE INICIAR</text>
<text x="48" y="204.53" fill="#112A40" font-size="19" font-weight="700">Fuente explícita</text>
<text x="48" y="227.66" fill="#40586D" font-size="18" font-weight="400">USB de banco o diario de reproducción.</text>
<text x="48" y="256.53" fill="#112A40" font-size="19" font-weight="700">Puerto y perfil</text>
<text x="48" y="279.66" fill="#40586D" font-size="18" font-weight="400">Elegir puerto, actualizar lista y verificar el perfil disponible.</text>
<text x="48" y="308.53" fill="#112A40" font-size="19" font-weight="700">Destino principal</text>
<text x="48" y="331.66" fill="#40586D" font-size="18" font-weight="400">Elegir ubicación de salida. Cada sesión crea un directorio.</text>
<text x="48" y="360.53" fill="#112A40" font-size="19" font-weight="700">Segundo destino</text>
<text x="48" y="383.66" fill="#40586D" font-size="18" font-weight="400">Confirmar medio físico y acceso antes de iniciar.</text>
<rect x="48" y="411" width="223" height="40" fill="#FFFFFF" stroke="#A7BBC8"/>
<text x="59" y="434.66" fill="#112A40" font-size="18" font-weight="700">Comprobar destinos</text>
<rect x="285" y="411" width="197" height="40" fill="#08756A" stroke="#08756A"/>
<text x="296" y="434.66" fill="#FFFFFF" font-size="18" font-weight="700">Iniciar sesión</text>
<rect x="792" y="132" width="778" height="335" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="808" y="162.27" fill="#112A40" font-size="21" font-weight="700">DURANTE LA ADQUISICIÓN</text>
<rect x="809" y="185" width="744" height="63" fill="#FFF0CD"/>
<text x="823" y="209.53" fill="#815000" font-size="19" font-weight="700">DESTINO SECUNDARIO DEGRADADO</text>
