<text x="58" y="761.66" fill="#112A40" font-size="18" font-weight="700">03:10:58</text>
<text x="210" y="761.66" fill="#112A40" font-size="18" font-weight="400">B-0041</text>
<text x="337" y="761.66" fill="#112A40" font-size="18" font-weight="400">POWER_STATUS</text>
