<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="02_comandos-title 02_comandos-desc">
<title id="02_comandos-title">02 · Comandos</title><desc id="02_comandos-desc">Selección, confirmación y trazabilidad de una orden en un ejemplo USB de banco. Diseño final de la interfaz, datos de ejemplo.</desc>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1600" height="1000" fill="#F2F5F8"/>
<rect x="0" y="0" width="1600" height="82" fill="#102C43"/>
<text x="29" y="47.71" fill="#FFFFFF" font-size="33" font-weight="700">ASTRA</text>
<text x="171" y="48.36" fill="#FFFFFF" font-size="28" font-weight="700">CONTROL DE COMANDOS</text>
<rect x="1200" y="20" width="371" height="42" fill="#E3F3F0"/>
<text x="1215" y="46.40" fill="#08756A" font-size="20" font-weight="700">USB DE BANCO · EJEMPLO</text>
<text x="30" y="108.53" fill="#40586D" font-size="19" font-weight="400">COMANDOS  /  Flujo ampliado de la consola · Ejemplo USB de banco</text>
<rect x="30" y="951" width="1540" height="1" fill="#CDD9E2"/>
<text x="30" y="978.66" fill="#40586D" font-size="18" font-weight="400">La consola principal se mantiene en operación. Este diseño detalla el flujo de confirmación y sus estados.</text>
<rect x="30" y="132" width="785" height="436" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="46" y="162.27" fill="#112A40" font-size="21" font-weight="700">01   PREPARAR ORDEN</text>
<text x="48" y="202.53" fill="#40586D" font-size="19" font-weight="700">Destino verificado</text>
<text x="48" y="239.88" fill="#112A40" font-size="24" font-weight="700">Equipo de banco 1000 · Perfil USB</text>
<text x="48" y="282.53" fill="#40586D" font-size="19" font-weight="700">Comando</text>
<rect x="48" y="298" width="733" height="40" fill="#FFFFFF" stroke="#A7BBC8"/>
<text x="59" y="321.66" fill="#112A40" font-size="18" font-weight="700">SET_TIME · Ajustar hora UTC   ▾</text>
<text x="48" y="373.53" fill="#40586D" font-size="19" font-weight="700">Argumentos</text>
<text x="48" y="454.53" fill="#40586D" font-size="19" font-weight="700">Efecto esperado</text>
<text x="48" y="486.40" fill="#112A40" font-size="20" font-weight="400">Comparar la hora reportada con la UTC solicitada.</text>
<rect x="48" y="511" width="218" height="40" fill="#FFFFFF" stroke="#A7BBC8"/>
<text x="59" y="534.66" fill="#112A40" font-size="18" font-weight="700">Previsualizar</text>
<rect x="835" y="132" width="735" height="436" fill="#FFFFFF" stroke="#CDD9E2"/>
<text x="851" y="162.27" fill="#112A40" font-size="21" font-weight="700">02   CONFIRMAR Y ENVIAR</text>
<rect x="853" y="183" width="699" height="63" fill="#FFF0CD"/>
<text x="867" y="207.53" fill="#815000" font-size="19" font-weight="700">CONFIRMACIÓN REQUERIDA</text>
<text x="867" y="231.79" fill="#112A40" font-size="17" font-weight="400">Equipo 1000 · USB · SET_TIME · 03:11:15 UTC</text>
<text x="853" y="282.53" fill="#112A40" font-size="19" font-weight="700">ID asignado</text>
<text x="853" y="305.66" fill="#40586D" font-size="18" font-weight="400">B-0043 · Ligado a esta sesión</text>
<text x="853" y="334.53" fill="#112A40" font-size="19" font-weight="700">Resultado esperado</text>
<text x="853" y="357.66" fill="#40586D" font-size="18" font-weight="400">Correlacionar respuesta y verificar la hora en telemetría.</text>
<text x="853" y="386.53" fill="#112A40" font-size="19" font-weight="700">Al perder enlace</text>
<text x="853" y="409.66" fill="#40586D" font-size="18" font-weight="400">El envío se bloquea y la orden preparada debe revisarse.</text>
<rect x="853" y="499" width="210" height="40" fill="#FFFFFF" stroke="#A7BBC8"/>
<text x="864" y="522.66" fill="#112A40" font-size="18" font-weight="700">Cancelar</text>
<rect x="1078" y="499" width="249" height="40" fill="#08756A" stroke="#08756A"/>
<text x="1089" y="522.66" fill="#FFFFFF" font-size="18" font-weight="700">Confirmar envío</text>
